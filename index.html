<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভোটার ডাটাবেস সার্চ</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace; /* বটের মতো লুক দিতে */
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        .search-box {
            background: #161b22;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #30363d;
            margin-bottom: 20px;
        }
        input {
            width: 80%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: white;
            border-radius: 5px;
            margin-bottom: 15px;
            outline: none;
        }
        button {
            padding: 10px 25px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #2ea043; }

        /* বটের রেজাল্টের মতো বক্স ডিজাইন */
        .result-block {
            background: #000; /* বটের ব্ল্যাক থিম */
            color: #00ff00; /* হ্যাকার বা টার্মিনাল গ্রিন কালার */
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: left;
            white-space: pre-wrap; /* লাইন ব্রেক ঠিক রাখার জন্য */
            border-left: 4px solid #238636;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .gender-label {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 10px;
            margin-bottom: 10px;
            color: white;
            font-weight: bold;
        }
        .male-bg { background: #1f6feb; }
        .female-bg { background: #db61a2; }
        
        #status { margin-bottom: 10px; font-size: 14px; color: #8b949e; }
    </style>
</head>
<body>

    <div class="container">
        <div class="search-box">
            <h2>ভোটার সার্চ টুল (Bot Web) 🔍</h2>
            <input type="text" id="searchInput" placeholder="নাম বা তথ্য লিখে সার্চ করুন...">
            <br>
            <button onclick="searchVoter()">SEARCH</button>
        </div>

        <div id="status"></div>
        <div id="results"></div>
    </div>

    <script>
        async function searchVoter() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const resultDiv = document.getElementById('results');
            const statusDiv = document.getElementById('status');
            
            if (!query) {
                statusDiv.innerHTML = "অনুগ্রহ করে কিছু লিখুন!";
                return;
            }

            statusDiv.innerHTML = "Searching GitHub database... Please wait.";
            resultDiv.innerHTML = "";
            let foundCount = 0;

            try {
                // আপনার বটের মতো দুটি ফাইল
                const files = [
                    { name: 'voter(male).txt', gender: 'MALE LIST', class: 'male-bg' },
                    { name: 'voter(female).txt', gender: 'FEMALE LIST', class: 'female-bg' }
                ];

                for (let file of files) {
                    const response = await fetch(file.name);
                    const content = await response.text();
                    
                    // আপনার বটের লজিক: splitting by '['
                    const blocks = content.split("[");
                    
                    blocks.forEach(block => {
                        if (!block.trim()) return;
                        
                        let fullBlock = "[" + block; // ব্র্যাকেট আবার যোগ করা
                        
                        if (fullBlock.toLowerCase().includes(query)) {
                            foundCount++;
                            const blockHtml = `
                                <div class="result-block">
                                    <span class="gender-label ${file.class}">${file.gender}</span><br>
                                    ${fullBlock.trim()}
                                </div>`;
                            resultDiv.innerHTML += blockHtml;
                        }
                    });
                }

                if (foundCount > 0) {
                    statusDiv.innerHTML = `✅ Total ${foundCount} records found.`;
                } else {
                    statusDiv.innerHTML = `❌ No record found for '${query}'.`;
                }

            } catch (error) {
                statusDiv.innerHTML = "Error: ফাইল খুঁজে পাওয়া যায়নি। নিশ্চিত করুন ফাইলের নাম সঠিক আছে।";
            }
        }
    </script>
</body>
</html>
