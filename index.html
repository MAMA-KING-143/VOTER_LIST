<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভোটার ডাটাবেস ৬ নং আউলিয়াপুর ইউনিয়ন (২০২৬)</title>
    <style>
        body { font-family: 'Courier New', monospace; background-color: #0d1117; color: #c9d1d9; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .header-area { text-align: center; margin-bottom: 25px; border-bottom: 2px solid #238636; padding-bottom: 15px; width: 100%; max-width: 600px; }
        .header-area h1 { color: #58a6ff; margin: 0; font-size: 22px; }
        .header-area h2 { color: #fdbb2d; margin: 5px 0 0 0; font-size: 18px; }
        .search-box { background: #161b22; padding: 20px; border-radius: 12px; border: 1px solid #30363d; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
        input { width: 90%; padding: 12px; background: #0d1117; border: 1px solid #30363d; color: #00ff00; border-radius: 6px; margin-bottom: 15px; font-size: 16px; outline: none; text-align: center; }
        button { width: 100%; padding: 12px; background: #238636; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; }
        #status { margin-top: 15px; font-size: 13px; color: #8b949e; }
        #results { width: 100%; max-width: 600px; margin-top: 20px; }
        .result-card { background: #000; border: 1px solid #30363d; padding: 15px; border-radius: 8px; margin-bottom: 15px; white-space: pre-wrap; color: #00ff00; font-size: 14px; border-left: 5px solid #238636; }
        .tag { font-size: 10px; padding: 2px 6px; border-radius: 3px; color: white; font-weight: bold; margin-bottom: 10px; display: inline-block; }
        .male-tag { background: #1f6feb; }
        .female-tag { background: #db61a2; }
    </style>
</head>
<body oncontextmenu="return false;">
    <div class="header-area">
        <h1>৬ নং আউলিয়াপুর ইউনিয়ন</h1>
        <h2>৪ নং ওয়ার্ড</h2>
        </p> তুরান্ত ভোটার তালিকা ডিজিটাল ডাটাবেস</p>
    </div>
    <div class="search-box">
        <input type="text" id="userInput" placeholder="নাম বা বাবার নাম লিখুন...">
        <button onclick="startSearch()">অনুসন্ধান করুন</button>
        <div id="status">সার্চ করার জন্য তথ্য লিখুন</div>
    </div>
    <div id="results"></div>
    <script>
        async function startSearch() {
            const query = document.getElementById('userInput').value.trim().toLowerCase();
            const results = document.getElementById('results');
            const status = document.getElementById('status');
            if (!query) { status.innerHTML = "❌ নাম না লিখে সার্চ করা সম্ভব নয়!"; return; }
            status.innerHTML = "🔍 ডাটাবেস চেক করা হচ্ছে...";
            results.innerHTML = "";
            let count = 0;
            const files = [{ name: 'voter(mle).txt', label: 'MALE LIST', css: 'male-tag' }, { name: 'voter(femle).txt', label: 'FEMALE LIST', css: 'female-tag' }];
            try {
                for (let f of files) {
                    const res = await fetch(f.name);
                    if (!res.ok) continue;
                    const text = await res.text();
                    const blocks = text.split("[");
                    blocks.forEach(b => {
                        if (!b.trim()) return;
                        let fullBlock = "[" + b;
                        if (fullBlock.toLowerCase().includes(query)) {
                            count++;
                            results.innerHTML += `<div class="result-card"><span class="tag ${f.css}">${f.label}</span><br>${fullBlock.trim()}</div>`;
                        }
                    });
                }
                status.innerHTML = count > 0 ? `✅ মোট ${count}টি তথ্য পাওয়া গেছে।` : "❌ কোনো তথ্য পাওয়া যায়নি।";
            } catch (e) { status.innerHTML = "⚠️ ফাইল লোড করতে সমস্যা হয়েছে!"; }
        }
    </script>
</body>
</html>
