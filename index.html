<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভোটার সার্চ টুল - প্রো</</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
            padding: 20px; border-radius: 15px; width: 95%; max-width: 600px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); text-align: center;
        }
        input {
            width: 80%; padding: 12px; border-radius: 8px; border: none; margin-bottom: 15px; font-size: 16px;
        }
        button {
            padding: 10px 25px; border-radius: 8px; border: none; background: #27ae60; color: white; cursor: pointer;
        }
        #results { margin-top: 20px; }
        
        /* বক্সে সাজানোর ডিজাইন */
        .voter-card {
            background: rgba(0, 0, 0, 0.4);
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 10px;
            border-left: 5px solid #2980b9;
            text-align: left;
            font-size: 14px;
            line-height: 1.6;
        }
        .voter-card.female { border-left-color: #e84393; }
        
        .label { color: #aaa; font-weight: bold; margin-right: 5px; }
        .data-value { color: #fff; }
        .gender-badge {
            float: right; font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #2980b9;
        }
        .female .gender-badge { background: #e84393; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="container">
        <h2>ভোটার সার্চ টুল 🔍</h2>
        <input type="text" id="searchInput" placeholder="নাম বা তথ্য লিখে খুঁজুন...">
        <br>
        <button onclick="searchVoter()">খুঁজুন</button>

        <div id="results"></div>
    </div>

    <script>
        async function searchVoter() {
            const query = document.getElementById('searchInput').value.trim();
            const resultDiv = document.getElementById('results');
            if (!query) return;

            resultDiv.innerHTML = "খোঁজা হচ্ছে...";
            let html = "";

            try {
                // দুটি ফাইল থেকে ডেটা আনা
                const files = [
                    { name: 'voter(male).txt', gender: 'MALE', class: '' },
                    { name: 'voter(female).txt', gender: 'FEMALE', class: 'female' }
                ];

                for (let file of files) {
                    const res = await fetch(file.name);
                    const data = await res.text();
                    const lines = data.split('\n');

                    lines.forEach(line => {
                        if (line.includes(query)) {
                            // আপনার টেক্সট ফাইলের তথ্যগুলোকে আলাদা করা (ধরা যাক কমা বা স্পেস দিয়ে আলাদা)
                            // যদি আপনার ফাইলে তথ্যগুলো "ID: 101 Name: Abir" এভাবে থাকে
                            html += `
                                <div class="voter-card ${file.class}">
                                    <span class="gender-badge">${file.gender}</span>
                                    <div><span class="label">তথ্য:</span> <span class="data-value">${line}</span></div>
                                </div>`;
                        }
                    });
                }

                resultDiv.innerHTML = html || "কোনো তথ্য পাওয়া যায়নি।";
            } catch (e) {
                resultDiv.innerHTML = "Error loading files!";
            }
        }
    </script>
</body>
</html>
